<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApiSeries — Gerenciador de Séries</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ===== CABEÇALHO ===== -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="header-icon">🎬</span>
        <h1 class="header-title">ApiSeries</h1>
      </div>
      <span class="demo-badge" id="status-api">⏳ Conectando à API…</span>
    </div>
  </header>

  <main class="app-main">

    <!-- ===== FORMULÁRIO DE CADASTRO / EDIÇÃO ===== -->
    <section class="card form-section" aria-labelledby="form-title">
      <h2 class="card-title" id="form-title">Cadastrar Nova Série</h2>

      <form id="serie-form" novalidate>
        <!-- Campo oculto para guardar o ID durante edição -->
        <input type="hidden" id="campo-id" />

        <div class="form-grid">
          <div class="form-group">
            <label for="campo-titulo">Título <span class="required">*</span></label>
            <input
              type="text"
              id="campo-titulo"
              placeholder="Ex: Breaking Bad"
              maxlength="120"
              autocomplete="off"
            />
            <span class="field-error" id="erro-titulo"></span>
          </div>

          <div class="form-group">
            <label for="campo-genero">Gênero <span class="required">*</span></label>
            <input
              type="text"
              id="campo-genero"
              placeholder="Ex: Drama, Ficção Científica"
              maxlength="60"
              autocomplete="off"
            />
            <span class="field-error" id="erro-genero"></span>
          </div>

          <div class="form-group form-group--sm">
            <label for="campo-ano">Ano de Lançamento <span class="required">*</span></label>
            <input
              type="number"
              id="campo-ano"
              placeholder="Ex: 2023"
              min="1900"
              max="2099"
            />
            <span class="field-error" id="erro-ano"></span>
          </div>

          <div class="form-group form-group--sm">
            <label for="campo-temporadas">Nº de Temporadas <span class="required">*</span></label>
            <input
              type="number"
              id="campo-temporadas"
              placeholder="Ex: 4"
              min="1"
              max="99"
            />
            <span class="field-error" id="erro-temporadas"></span>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary" id="btn-salvar">
            <span class="btn-icon">＋</span> Cadastrar Série
          </button>
          <button type="button" class="btn btn--ghost" id="btn-cancelar" hidden>
            Cancelar edição
          </button>
        </div>
      </form>

      <!-- Toast de feedback -->
      <div class="toast" id="toast" role="alert" aria-live="polite"></div>
    </section>

    <!-- ===== LISTAGEM DE SÉRIES ===== -->
    <section class="card list-section" aria-labelledby="list-title">
      <div class="list-header">
        <h2 class="card-title" id="list-title">
          Séries Cadastradas
          <span class="badge" id="contador-series">0</span>
        </h2>
        <input
          type="search"
          id="campo-busca"
          class="search-input"
          placeholder="🔍 Filtrar por título ou gênero…"
          aria-label="Filtrar séries"
        />
      </div>

      <!-- Tabela (desktop) -->
      <div class="table-wrapper">
        <table class="series-table" id="tabela-series">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Título</th>
              <th scope="col">Gênero</th>
              <th scope="col">Ano</th>
              <th scope="col">Temporadas</th>
              <th scope="col" class="col-acoes">Ações</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- Preenchido via JS -->
          </tbody>
        </table>

        <!-- Estado vazio -->
        <div class="empty-state" id="estado-vazio" hidden>
          <span class="empty-icon">📭</span>
          <p>Nenhuma série encontrada.</p>
        </div>
      </div>
    </section>

  </main>

  <!-- ===== MODAL DE CONFIRMAÇÃO DE EXCLUSÃO ===== -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" hidden>
    <div class="modal">
      <h3 class="modal-titulo" id="modal-titulo">Confirmar exclusão</h3>
      <p class="modal-corpo" id="modal-corpo"></p>
      <div class="modal-acoes">
        <button class="btn btn--danger" id="btn-confirmar-exclusao">Excluir</button>
        <button class="btn btn--ghost" id="btn-cancelar-modal">Cancelar</button>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <p>ApiSeries · AP2 · Dados persistidos com EF Core + SQLite</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
